<body class="bg-[#F5F5DC] font-serif">
    <!-- Header -->
    <header>
        <div class="logo">
        <img src="Images/logo bg.png" alt="Ayushvera Logo" />
        </div>
        <nav class="d-none d-lg-flex">
            <a href="index.html" class="nav-link">Home</a>
            <a href="product.html" class="nav-link active">Products</a>
            <a href="aboutus.html" class="nav-link">About Us</a>

            <a href="happy_customer.html" class="nav-link">Happy Customer</a>
        </nav>
        <div class="icons">
            <button onclick="window.location.href='cart.php'" class="btn btn-outline-secondary me-2"><i class="fas fa-shopping-bag"></i></button>
            <button onclick="window.location.href='profile.php'" class="btn btn-outline-secondary"><i class="fas fa-user"></i></button>

    </header>

      <!-- Mobile Menu -->
    <div
        id="mobile-menu"
        class="hidden flex-col gap-4  bg-white text-black px-4 py-5  lg:hidden"
    >
        <a href="./index.html" class="block text-black py-2  border-b border-gray-700">Home</a>
        <a href="./product.html" class="block text-black py-2 border-b border-gray-700">Products</a>
        <a href="./aboutus.html" class="block text-black py-2 border-b border-gray-700">About Us</a>
        <a href="./contactus.html" class="block text-black py-2 border-b border-gray-700">Contact</a>

    </div>

    <div class="max-w-full mx-auto bg-blue-[#071b42]" >
        <!-- Reviews Section -->
        <div  class="  mb-4 w-full py-20 flex justify-center bg-[#071b42] text-white items-center ">
            <p data-aos="fade-up" class="tex-white text-4xl lg:text-5xl font-bold">Customer Review</p>
        </div>
    </div>
    <div class="max-w-4xl mx-auto">
        <div id="reviewsContainer" class="space-y-4">
            <!-- Dynamic reviews will appear here -->
        </div>
    </div>
</body>
 <!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
    // Initialize AOS animation library
    AOS.init({
      duration: 800,
      easing: 'ease-in-out',
      once: true
    });

    // Mobile menu toggle
    const btn = document.getElementById("mobile-menu-btn");
    const menu = document.getElementById("mobile-menu");

    btn.addEventListener("click", () => {
      menu.classList.toggle("hidden");
      menu.classList.toggle("flex");
    });

    async function loadReviews() {
        
        const res = await fetch(`./php/get_reviews.php`);
        const data = await res.json();

        if (!data || data.error) {
            document.getElementById("reviewsContainer").innerHTML =
                `<p class="text-gray-600">No reviews found.</p>`;
            return;
        }

        let html = "";

        data.forEach(review => {
            const stars = "⭐".repeat(review.rating);
            console.log(review.product_image)
            html += `
                <div class="border border-gray-200 p-4 rounded-xl bg-white shadow-sm">

                    <!-- PRODUCT INFO -->
                    <div class="flex items-center gap-4 mb-3">
                        <img src="./php/uploads/${review.product_image}" class="w-16 h-16 rounded-lg object-cover" />
                        <div>
                            <h2 class="font-semibold text-lg">${review.product_name}</h2>
                            <p class="text-gray-600 text-sm">₹${review.product_price}</p>
                        </div>
                    </div>

                    <!-- CUSTOMER REVIEW -->
                    <div class="p-3 bg-gray-50 rounded-lg">
                        <div class="flex justify-between items-center">
                            <h4 class="font-semibold">${review.customer_name}</h4>
                            <span class="text-yellow-500">${stars}</span>
                        </div>
                        <p class="text-gray-700 mt-2">${review.review_text}</p>
                    </div>

                </div>
            `;
        });

        document.getElementById("reviewsContainer").innerHTML = html;
    }

    // Load on page
    document.addEventListener("DOMContentLoaded", loadReviews);

</script>
</html>

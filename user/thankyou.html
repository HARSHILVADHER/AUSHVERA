<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thank You for Your Order!</title>
  <link rel="stylesheet" href="css/index.css" />
  <style>
    body { text-align: center; padding: 60px 20px; font-family: 'Montserrat', sans-serif; }
    .thankyou-box { background: #fff; border-radius: 15px; box-shadow: 0 4px 16px #0001; padding: 40px 20px; display: inline-block; }
    .thankyou-box h1 { color: #0B2A60; margin-bottom: 20px; }
    .thankyou-box p { color: #333; font-size: 1.2rem; margin-bottom: 30px; }
    .btn-more { background: #D4AF37; color: #0B2A60; border: none; border-radius: 8px; padding: 12px 30px; font-weight: 600; font-size: 1.1rem; text-decoration: none; }
    .btn-more:hover { background: #B8860B; color: #fff; }
  </style>
</head>
<body>
  <div class="thankyou-box">
    <h1>Thank You for Your Order!</h1>
    <h1>We Respect your time</h1>
    <p>Your order will be delivered in 7 working days.<br>We appreciate your trust in us.</p>
    <a href="product.html" class="btn-more">Buy More Products</a>
  </div>
</body>
</html>
